<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Cooked Are You? 🔥</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container" id="main-card">
  <h1> How Cooked Are You?</h1>
  <p class="subtitle">Enter your stats to reveal your fate</p>

  <div class="input-group">
    <input id="syllabus" type="number" placeholder="Syllabus Done %" max="100" />
    <input id="days" type="number" placeholder="Days Left" />
    <input id="sleep" type="number" placeholder="Sleep Hours" />
    <input id="delusion" type="number" placeholder="Delusion Level (1-10)" />
  </div>

  <button onclick="calculate()">Calculate My Fate</button>

  <div id="result" class="hidden">
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
