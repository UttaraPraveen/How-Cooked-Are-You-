<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Cooked Are You? 🔥</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="main-wrapper">
  <div class="hero-text fade-in-down">
    <h1>Academic<br>Wellness.</h1>
    <p>Just kidding. You're cooked.</p>
  </div>

  <div class="glass-card float-anim" id="main-card">
    <div class="card-header">
      <div class="status-dot"></div>
      <span>Assessment Tool</span>
    </div>

    <h2>Check Your Fate</h2>
    
    <div class="input-group">
      <label>Academic Victim Name</label>
      <input id="studentName" type="text" placeholder="e.g. Procrastination King" />
      
      <div class="row">
        <div class="col">
          <label>Syllabus %</label>
          <input id="syllabus" type="number" placeholder="0 - 100" />
        </div>
        <div class="col">
          <label>Days Left</label>
          <input id="days" type="number" placeholder="Days" />
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label>Sleep (Hrs)</label>
          <input id="sleep" type="number" placeholder="Hours" />
        </div>
        <div class="col">
          <label>Delusion (1-10)</label>
          <input id="delusion" type="number" placeholder="Level" />
        </div>
      </div>
    </div>

    <button class="primary-btn" onclick="calculate()">
      Generate Verdict 
      <span class="arrow">→</span>
    </button>
  </div>

  <div id="result" class="result-card hidden">
  </div>

  <div id="actions" class="action-dock hidden">
    <button id="copiumBtn" class="pill-btn purple hidden" onclick="takeCopium()">💊 Delulu Pill</button>
    <button id="tombstoneBtn" class="pill-btn gray" onclick="generateTombstone()">🪦 Tombstone</button>
  </div>
</div>

<div id="tombstoneModal" class="modal-overlay hidden" onclick="closeModal(event, 'tombstoneModal')">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal(event, 'tombstoneModal')">×</button>
    <h2>Rest In Peace 🪦</h2>
    <p>Press 'Download' to accept your fate.</p>
    <img id="tombstonePreview" src="" alt="Your Academic Tombstone" />
    <button class="primary-btn download-action" onclick="downloadImage()">Download Image ⇩</button>
  </div>
</div>

<div id="deluluModal" class="modal-overlay hidden" onclick="closeModal(event, 'deluluModal')">
    <div class="modal-content delulu-content">
      <button class="close-btn" onclick="closeModal(event, 'deluluModal')">×</button>
      
      <div class="pill-icon">💊</div>
      <h2>Prescription Received</h2>
      <p class="patient-label">Patient: <span id="deluluPatient"></span></p>
      
      <div class="quote-box">
          <p id="deluluQuote">"Quote goes here"</p>
      </div>
      
      <button class="primary-btn download-action" onclick="closeModal(event, 'deluluModal')">
        I Believe It ✨
      </button>
    </div>
</div>

<canvas id="tombstoneCanvas" width="400" height="500" style="display:none;"></canvas>

<script src="script.js"></script>
</body>
</html>
